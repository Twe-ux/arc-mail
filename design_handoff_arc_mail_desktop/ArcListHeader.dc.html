<x-dc>
<header style="height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.1);font-family:Geist,system-ui,sans-serif;color:#fafafa">

  <span style="font-size:12px;color:oklch(.708 0 0);font-variant-numeric:tabular-nums">5</span>
