<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;min-height:0;min-width:0;overflow:hidden;font-family:Geist,system-ui,sans-serif;color:#fafafa">
  <ul style="margin:0;padding:8px;list-style:none;display:flex;flex-direction:column;gap:4px;min-width:0">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
      <li style="{{ r.li }}">
        <span style="{{ r.avatar }}">{{ r.ini }}</span>
        <div style="min-width:0;flex:1">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="{{ r.dot }}"></span>
            <span style="{{ r.who }}">{{ r.name }}</span>
            <span style="{{ r.count }}">{{ r.n }}</span>
            <time style="margin-left:auto;flex:none;font-size:12px;color:oklch(.708 0 0);font-variant-numeric:tabular-nums">{{ r.when }}</time>
          </div>
          <p style="{{ r.subject }}">{{ r.sub }}</p>
          <p style="margin:4px 0 0;font-size:12px;color:oklch(.708 0 0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.snippet }}</p>
        </div>
      </li>
    </sc-for>
  </ul>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:420},&quot;activeIndex&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:4}}">
const DATA = [
  { ini:"CD", hue:[20,60],  name:"Claire Dubois",   when:"09:41",   n:"3", unread:true,  sub:"Week-end à Annecy : on confirme ?", snippet:"J'ai regardé les dispos pour le 20 : le gîte est libre." },
  { ini:"LP", hue:[220,260],name:"La Poste",        when:"06:40",   n:"",  unread:true,  sub:"Votre colis est en route",          snippet:"Livraison demain entre 9h et 13h." },
  { ini:"AG", hue:[140,180],name:"Amélie Garnier",  when:"4 sept.", n:"2", unread:false, sub:"Photos de l'anniversaire",          snippet:"Voici les trois meilleures en pièce jointe." },
  { ini:"DO", hue:[260,300],name:"Doctolib",        when:"3 sept.", n:"",  unread:false, sub:"Rappel : rendez-vous mardi 9h30",   snippet:"Dr Fabre, 12 rue des Marquisats." },
  { ini:"NB", hue:[320,0],  name:"Nina Bernard",    when:"2 sept.", n:"",  unread:false, sub:"Cours d'escalade — rentrée",        snippet:"Les inscriptions pour la saison sont ouvertes." },
];

class Component extends DCLogic {
  renderVals() {
    const active = this.props.activeIndex ?? 0;
    return {
      rows: DATA.map((r, i) => ({
        ini: r.ini,
        name: r.name,
        when: r.when,
        sub: r.sub,
        snippet: r.snippet,
        n: r.n,
        /* 14 px à droite, pas 40 : la réserve servait à une étoile au survol
           qui n'est pas dessinée ici, et elle poussait le min-content de la
           colonne à 390 px — la liste débordait sous 390. */
        li: "display:flex;align-items:flex-start;gap:12px;padding:10px 14px 10px 12px;border-radius:10px;cursor:pointer;transition:background .15s;min-width:0;background:"
          + (i === active ? "oklch(.269 0 0)" : "transparent"),
        avatar: "width:36px;height:36px;flex:none;margin-top:2px;border-radius:999px;display:grid;place-items:center;font:600 12px Geist,system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,oklch(.78 .12 "
          + r.hue[0] + "),oklch(.58 .17 " + r.hue[1] + "))",
        dot: r.unread
          ? "width:8px;height:8px;flex:none;border-radius:999px;background:#a855f7"
          : "display:none",
        who: "overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:" + (r.unread ? "600" : "500"),
        count: r.n
          ? "flex:none;font-size:12px;color:oklch(.708 0 0);font-variant-numeric:tabular-nums"
          : "display:none",
        subject: "margin:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
          + (r.unread ? "font-weight:500;color:#fafafa" : "color:oklch(.708 0 0)"),
      })),
    };
  }
}

</script>
</body>
</html>
